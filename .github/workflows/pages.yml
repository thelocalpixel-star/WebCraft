name: Publish WebCraft to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 23-30 11 *'
      timezone: America/New_York
    - cron: '17 9 1-22 12 *'
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: webcraft-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check release window
        id: release
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          current_year=$(TZ=America/New_York date +%Y)
          if [[ "$EVENT" != "schedule" || "$current_year" == "2026" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.publish == 'true'
        with:
          persist-credentials: false

      - name: Verify and build the current release
        if: steps.release.outputs.publish == 'true'
        run: |
          python3 scripts/test_publish_articles.py
          python3 scripts/verify_seo.py
          node --test scripts/test_analytics.cjs scripts/test_contact.cjs
          python3 scripts/publish_articles.py
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 5 --retry-connrefused --silent --show-error --fail http://127.0.0.1:4173/ -o /dev/null
          python3 scripts/verify_site.py --root _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.release.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
